<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNSシェルフ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Crect x='9' y='29' width='46' height='4' rx='2' fill='%23fff'/%3E%3Crect x='9' y='52' width='46' height='4' rx='2' fill='%23fff'/%3E%3Ccircle cx='19' cy='19' r='7.5' fill='%23fbbf24'/%3E%3Ccircle cx='36' cy='19' r='7.5' fill='%23f87171'/%3E%3Crect x='12' y='37' width='20' height='12' rx='6' fill='%2393c5fd'/%3E%3Ccircle cx='44' cy='43' r='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4f0;--panel:#fff;--panel2:#faf9f6;--ink:#1c1e22;--mut:#6b6f76;--line:#e4e1da;
  --acc:#0f766e;--acc2:#0b5d56;--accs:#dcefeb;--warn:#b45309;--warns:#fdf1e2;--danger:#c2410c;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);--chip:#fff;color-scheme:light;
  --closed:#d6d6d6;--closed-ink:#555;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141619;--panel:#1c1f23;--panel2:#191c20;--ink:#e7e5e1;--mut:#9ba0a7;--line:#2d3137;
  --acc:#2dd4bf;--acc2:#5eead4;--accs:#123631;--warn:#fbbf24;--warns:#3a2a10;--danger:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--chip:#23272c;color-scheme:dark;
  --closed:#3b3e43;--closed-ink:#a3a7ad;
}}
:root[data-theme=dark]{
  --bg:#141619;--panel:#1c1f23;--panel2:#191c20;--ink:#e7e5e1;--mut:#9ba0a7;--line:#2d3137;
  --acc:#2dd4bf;--acc2:#5eead4;--accs:#123631;--warn:#fbbf24;--warns:#3a2a10;--danger:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--chip:#23272c;color-scheme:dark;
  --closed:#3b3e43;--closed-ink:#a3a7ad;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}

/* ===== header ===== */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.logo svg{width:26px;height:26px}
.addbar{flex:1 1 420px;display:flex;min-width:0;background:var(--panel);border:1.5px solid var(--acc);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.addbar input{flex:1;min-width:0;border:0;background:transparent;padding:8px 12px;outline:none}
.addbar button{border:0;background:var(--acc);color:#fff;padding:0 16px;font-weight:600}
:root[data-theme=dark] .addbar button{color:#062b27}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .addbar button{color:#062b27}}
.search{flex:0 1 220px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;outline:none}
.search:focus,.addbar:focus-within{box-shadow:0 0 0 3px var(--accs)}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 8px}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;padding:0}
.ibtn:hover{border-color:var(--acc)}
.ibtn svg{width:18px;height:18px}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn:disabled:hover{border-color:var(--line)}
.ibtn.undo{position:relative}
.ibtn.undo span{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center}
.ibtn.undo span:empty{display:none}
.state{font-size:12px;color:var(--mut);white-space:nowrap;border:0;background:none;padding:4px 6px;border-radius:8px}
.state.ok::before{content:"●";color:#16a34a;margin-right:4px}
.state.warn{color:var(--warn)}
.state.warn::before{content:"▲";margin-right:4px}

.banner{margin:12px 18px 0;padding:10px 14px;border-radius:10px;background:var(--warns);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner:empty{display:none}
.banner .sp{flex:1}

/* ===== layout ===== */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding:14px 18px 60px}
.side{position:sticky;top:72px;align-self:start;display:flex;flex-direction:column;gap:2px}
.side .nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;border:0;background:none;text-align:left;width:100%}
.side .nav:hover{background:var(--panel)}
.side .nav.on{background:var(--accs);color:var(--acc2);font-weight:600}
.side .nav .n{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.side .nav .ic{width:20px;height:20px;flex:none}
.side hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.side .addsite{color:var(--mut)}

.site{margin-bottom:26px}
.site h2{display:flex;align-items:center;gap:9px;font-size:16px;margin:2px 2px 10px}
.site h2 .ic{width:24px;height:24px}
.site h2 small{color:var(--mut);font-weight:400;font-size:12px}
.site h2 .tbtn{margin-left:2px}
.tbtn{border:0;background:none;color:var(--mut);border-radius:7px;padding:2px 7px;font-size:12px}
.tbtn:hover{background:var(--panel);color:var(--ink)}

.cat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px 12px;margin-bottom:10px;position:relative}
.cathead{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);min-height:26px}
.cathead .grip{cursor:grab;opacity:.45;font-size:12px;letter-spacing:-2px;padding:0 2px;user-select:none}
.cathead .cname{font-weight:700;color:var(--ink);cursor:text;padding:1px 4px;border-radius:5px}
.cathead .cname:hover{background:var(--panel2)}
.cathead .cnt{font-size:12px}
.cathead .sp{flex:1}
.cathead input{font-weight:700;border:1px solid var(--acc);border-radius:6px;padding:1px 6px;background:var(--panel);outline:none;width:180px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;min-height:34px}
.cat.mark-t::before,.cat.mark-b::after{content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:var(--acc)}
.cat.mark-t::before{top:-7px}.cat.mark-b::after{bottom:-7px}

.chip{position:relative;display:inline-flex}
.chip a{display:inline-flex;align-items:center;gap:7px;height:36px;padding:3px 14px 3px 3px;border-radius:999px;background:var(--chip);border:1px solid var(--line);text-decoration:none;max-width:260px;transition:transform .12s,box-shadow .12s,border-color .12s}
.chip a:hover{border-color:var(--acc);box-shadow:var(--shadow);transform:translateY(-1px)}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .memo-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;margin-left:-3px}
.chip .ed{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:none;place-items:center;padding:0;font-size:11px;box-shadow:var(--shadow)}
.chip:hover .ed,.chip .ed:focus-visible{display:grid}
.chip .ed:hover{border-color:var(--acc);color:var(--acc)}
.chip.stale a{opacity:.5}
.chip.stale a:hover{opacity:1}
.chip.stale .av img{filter:grayscale(1)}
.chip.dragging{opacity:.3}
.chip.mark-l::before,.chip.mark-r::after{content:"";position:absolute;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--acc)}
.chip.mark-l::before{left:-6px}.chip.mark-r::after{right:-6px}
.chip.flash a{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 4px var(--acc);border-color:var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.av{position:relative;width:28px;height:28px;border-radius:50%;flex:none;overflow:hidden;background:hsl(var(--h) 55% 48%);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.av i{font-style:normal}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s;background:var(--panel)}
.av img.ld{opacity:1}
.addchip{height:36px;min-width:36px;border-radius:999px;border:1.5px dashed var(--line);background:none;color:var(--mut);font-size:18px;line-height:1;padding:0 12px}
.addchip:hover{border-color:var(--acc);color:var(--acc)}
.chips.mark-end .addchip{box-shadow:-6px 0 0 -3px var(--acc)}
.addcat{border:1.5px dashed var(--line);background:none;color:var(--mut);border-radius:12px;padding:8px 14px;width:100%;text-align:left}
.addcat:hover{border-color:var(--acc);color:var(--acc)}
.empty{color:var(--mut);padding:40px 10px;text-align:center}
.hint-first{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;color:var(--mut)}
.hint-first b{color:var(--ink)}
kbd{font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}

/* ===== dialogs ===== */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,15,.45)}
dialog form{padding:18px 20px 16px;display:flex;flex-direction:column;gap:11px}
dialog h3{margin:0 0 2px;font-size:16px}
dialog label{display:flex;flex-direction:column;gap:3px}
dialog label>span,.lbl{font-size:12px;color:var(--mut);font-weight:600}
dialog input,dialog select,dialog textarea{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px;outline:none;width:100%}
dialog input:focus,dialog select:focus,dialog textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
dialog textarea{resize:vertical}
dialog label.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;cursor:pointer;width:fit-content}
dialog label.chk input{width:16px;height:16px;margin:0;accent-color:var(--acc)}
.chkrow{display:flex;gap:22px;flex-wrap:wrap}
.iconrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:-4px}
.iconrow img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--panel2)}
dialog label.chk.off{opacity:.5;cursor:default}
dialog label.chk.off input{cursor:default}
.chip.closed a{background:var(--closed);border-color:var(--closed);color:var(--closed-ink)}
.chip.closed a:hover{border-color:var(--mut)}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);white-space:nowrap;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.toggle input:checked{background:var(--acc)}
.toggle input:checked::after{transform:translateX(14px)}
.toggle input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mut);margin-top:-6px;min-height:18px}
.hint.ok{color:var(--acc)}
.hint.ng{color:var(--warn)}
.warn{font-size:12px;color:var(--warn)}
.warn:empty{display:none}
.urlprev{font-size:12px;color:var(--mut);word-break:break-all}
.urlprev a{color:var(--acc)}
.btns{display:flex;gap:8px;align-items:center;margin-top:4px}
.btns .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 14px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
:root[data-theme=dark] .btn.pri{color:#062b27}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{color:#062b27}}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.catpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.catpick button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 12px}
.catpick button.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme=dark] .catpick button.on{color:#062b27}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .catpick button.on{color:#062b27}}
.catpick input{width:150px;border-radius:999px;padding:4px 12px}
.set-sec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.set-sec h4{margin:0;font-size:13px}
.set-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set-row input[type=number]{width:80px}
.small{font-size:12px;color:var(--mut)}

.menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:150px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px}
.menu button:hover{background:var(--panel2)}
.menu button.danger{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;transition:.2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:var(--acc);font-weight:700;padding:0}
:root:not([data-theme=dark]) .toast button{color:#5eead4}
.dropover{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--acc) 14%,transparent);border:3px dashed var(--acc);display:none;place-items:center;font-size:20px;font-weight:700;color:var(--acc2);pointer-events:none}
.dropover.show{display:grid}

@media (max-width:760px){
  .top{flex-wrap:wrap;padding:10px 16px;gap:8px}
  .logo{font-size:0;gap:0}
  .sel{padding:7px 4px}
  .addbar{order:5;flex-basis:100%}
  .search{flex:1 1 120px}
  .layout{grid-template-columns:1fr;padding:12px 16px 60px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px}
  .side .nav{width:auto;white-space:nowrap}
  .side hr{display:none}
  .banner{margin:12px 16px 0}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f766e"/><rect x="9" y="29" width="46" height="4" rx="2" fill="#fff"/><rect x="9" y="52" width="46" height="4" rx="2" fill="#fff"/><circle cx="19" cy="19" r="7.5" fill="#fbbf24"/><circle cx="36" cy="19" r="7.5" fill="#f87171"/><rect x="12" y="37" width="20" height="12" rx="6" fill="#93c5fd"/><circle cx="44" cy="43" r="6" fill="#fff"/></svg>SNSシェルフ</div>
  <form class="addbar" id="addForm"><input id="addInput" placeholder="URLを貼り付けて登録（画面のどこでも Ctrl+V でもOK）" autocomplete="off"><button>登録</button></form>
  <input class="search" id="q" type="search" placeholder="検索（ / ）" autocomplete="off">
  <select class="sel" id="sort" title="並び順">
    <option value="manual">手動の順</option>
    <option value="name">名前順</option>
    <option value="recent">最近開いた順</option>
    <option value="old">開いていない順</option>
  </select>
  <label class="toggle" title="閉鎖済みのチャンネルを表示する"><input type="checkbox" id="showClosed">閉鎖済み</label>
  <button class="state" id="state" type="button"></button>
  <button class="ibtn undo" id="undoBtn" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span id="undoN"></span></button>
  <button class="ibtn" id="setBtn" type="button" title="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<div class="banner" id="banner"></div>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

<!-- 登録・編集 -->
<dialog id="itemDlg"><form id="itemForm" method="dialog">
  <h3 id="iTitle">登録</h3>
  <label id="urlRow"><span>URL または ID</span><input id="fUrl" autocomplete="off" placeholder="https://www.youtube.com/@HikakinTV/videos"></label>
  <div class="hint" id="parseMsg"></div>
  <div class="iconrow" id="fIconRow" hidden><img id="fIconImg" alt="">ページのアイコンを使います</div>
  <div class="grid2">
    <label><span>サイト</span><select id="fSite"></select></label>
    <label><span>ID</span><input id="fId" autocomplete="off"></label>
  </div>
  <label><span>表示名</span><input id="fName" autocomplete="off" placeholder="空欄なら ID"></label>
  <div><span class="lbl">カテゴリ</span><div class="catpick" id="fCats"></div></div>
  <label><span>メモ（なぜ保存したか など）</span><textarea id="fMemo" rows="2"></textarea></label>
  <div class="chkrow">
    <label class="chk"><input type="checkbox" id="fClosed">閉鎖済み</label>
    <label class="chk" id="noAvRow"><input type="checkbox" id="fNoAv">アイコンを取得しない</label>
  </div>
  <div class="warn" id="dupMsg"></div>
  <div class="urlprev">開くURL：<a id="fPrev" target="_blank" rel="noopener"></a></div>
  <div class="small" id="fInfo"></div>
  <div class="btns">
    <button type="button" class="btn danger" id="fDel">削除</button>
    <button type="button" class="btn" id="fAv">アイコン再取得</button>
    <span class="sp"></span>
    <button type="button" class="btn" data-close>キャンセル</button>
    <button class="btn pri" id="fOk">登録</button>
  </div>
</form></dialog>

<!-- サイト編集 -->
<dialog id="siteDlg"><form id="siteForm" method="dialog">
  <h3 id="sTitle">サイトを編集</h3>
  <label><span>表示名</span><input id="sName" autocomplete="off" placeholder="YouTubeチャンネル"></label>
  <label><span>URL（ID の場所を {ID} にする）</span><input id="sTpl" autocomplete="off" placeholder="https://www.youtube.com/@{ID}/videos"></label>
  <div class="hint" id="sMsg"></div>
  <label><span>別のドメイン（任意・URL判定用、カンマ区切り）</span><input id="sAlias" autocomplete="off" placeholder="twitter.com"></label>
  <label><span>アイコンの取得（unavatar.io）</span><select id="sAv"></select></label>
  <div class="btns">
    <button type="button" class="btn danger" id="sDel">サイトを削除</button>
    <span class="sp"></span>
    <button type="button" class="btn" data-close>キャンセル</button>
    <button class="btn pri" id="sOk">保存</button>
  </div>
</form></dialog>

<!-- 設定 -->
<dialog id="setDlg"><form method="dialog" id="setForm">

<script>
'use strict';
/* ============ 基本 ============ */
const LS_DATA = 'snsShelf.data', LS_UI = 'snsShelf.ui';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const DAY = 864e5;
const AV_PROVIDERS = [['', 'なし（頭文字）'], ['youtube', 'YouTube'], ['x', 'X（Twitter）'], ['instagram', 'Instagram'], ['tiktok', 'TikTok'], ['twitch', 'Twitch'], ['bluesky', 'Bluesky'], ['github', 'GitHub'], ['reddit', 'Reddit'], ['soundcloud', 'SoundCloud'], ['telegram', 'Telegram']];

function seed() {
  return { app: 'sns-shelf', version: 1, updatedAt: 0, settings: { staleDays: 30 }, sites: [
    { id: uid(), name: 'YouTubeチャンネル', template: 'https://www.youtube.com/@{ID}/videos', aliases: '', avatar: 'youtube',
      cats: [{ id: uid(), name: '趣味', items: [] }, { id: uid(), name: '勉強', items: [] }] },
    { id: uid(), name: 'Xユーザー', template: 'https://x.com/{ID}', aliases: 'twitter.com', avatar: 'x',
      cats: [{ id: uid(), name: 'インフルエンサー', items: [] }, { id: uid(), name: '公式', items: [] }] },
  ]};
}
function normalize(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.sites)) throw new Error('SNSシェルフのデータではありません');
  d.app = 'sns-shelf'; d.version = 1; d.updatedAt = +d.updatedAt || 0;
  d.rev = typeof d.rev === 'string' ? d.rev : ''; d.hist = Array.isArray(d.hist) ? d.hist.filter(x => typeof x === 'string') : [];
  d.settings = Object.assign({ staleDays: 30 }, d.settings || {});
  for (const s of d.sites) {
    s.id ||= uid(); s.name = String(s.name || 'サイト'); s.template = String(s.template || '');
    s.aliases = String(s.aliases || ''); s.avatar = String(s.avatar || '');
    s.cats = Array.isArray(s.cats) ? s.cats : [];
    for (const c of s.cats) {
      c.id ||= uid(); c.name = String(c.name || 'カテゴリ'); c.items = Array.isArray(c.items) ? c.items : [];
      for (const it of c.items) {
        it.id ||= uid(); it.pid = String(it.pid || ''); it.name = String(it.name || '');
        it.memo = String(it.memo || ''); it.added = +it.added || Date.now(); it.opened = +it.opened || 0;
        if (!d.avFix1 && !it.av) { delete it.avMiss; delete it.avFails; } // 旧版は回数制限での失敗も数えていたのでやり直す
      }
    }
  }
  d.avFix1 = 1;
  return d;
}

let data;
try { data = normalize(JSON.parse(localStorage.getItem(LS_DATA))); } catch { data = normalize(seed()); }
let ui = { view: 'all', sort: 'manual', showClosed: true };
try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI)) || {}); } catch {}
const saveUi = () => { try { localStorage.setItem(LS_UI, JSON.stringify(ui)); } catch {} };

const findSite = id => data.sites.find(s => s.id === id);
function findItem(iid) {
  for (const s of data.sites) for (const c of s.cats) { const i = c.items.findIndex(x => x.id === iid); if (i >= 0) return { s, c, i, it: c.items[i] }; }
  return null;
}
const urlOf = (site, pid) => site.template.split('{ID}').join(encodeURIComponent(pid));
const dispName = it => it.name || it.pid;
const isStale = it => !it.closed && Date.now() - (it.opened || it.added) > data.settings.staleDays * DAY;
function hue(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h % 360; }
function ago(t) {
  const d = Math.floor((Date.now() - t) / DAY);
  if (d <= 0) return '今日'; if (d === 1) return '昨日'; if (d < 31) return d + '日前';
  if (d < 365) return Math.floor(d / 30) + 'か月前'; return Math.floor(d / 365) + '年前';
}

/* ============ IndexedDB（ファイルハンドル保持） ============ */
function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open('snsShelf', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbGet(k) { const db = await idb(); return new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise(res => { const t = db.transaction('kv', 'readwrite'); v === undefined ? t.objectStore('kv').delete(k) : t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); }

/* ============ 端末どうしの変更を合わせる ============
   同じJSONを複数の端末で使っても、片方の変更が消えないようにする。
   ・ファイルには版の名前 rev と、そこまでの版の一覧 hist を入れておく
   ・版ごとの控え（アイコン画像を除く）を IndexedDB に残し、「最後にそろった時点」を基準に
     この端末の変更と、ほかの端末の変更を両方取り込む（merge3）
   ・基準が見つからないときは、消さずに両方を足し合わせる */
function hash(str) { // cyrb53
  let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
}
const bodyHash = d => hash(JSON.stringify([d.settings, d.sites]));
const uniq = a => [...new Set(a.filter(Boolean))];
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([p], [q]) => p < q ? -1 : 1)) : x);
const sameBody = (x, y) => canon([x.settings, x.sites]) === canon([y.settings, y.sites]);
const eachItem = (d, fn) => { for (const s of d.sites) for (const c of s.cats) for (const it of c.items) fn(it, c, s); };
const countItems = d => { let n = 0; eachItem(d, () => n++); return n; };

let bases = []; // [{rev, snap, own}] 新しい順
const baseOf = rev => { const b = bases.find(x => x.rev === rev); return b ? JSON.parse(b.snap) : null; };
function rememberBase(rev, d, own) {
  const snap = JSON.stringify({ settings: d.settings, sites: d.sites }, (k, v) => k === 'av' ? undefined : v);
  bases = [{ rev, snap, own }, ...bases.filter(x => x.rev !== rev)];
  let o = 0, t = 0; bases = bases.filter(x => x.own ? ++o <= 30 : ++t <= 15);
  idbSet('bases', bases).catch(() => {});
}

const eqv = (x, y) => canon(x) === canon(y);
function mergeFields(b, m, t, pref, skip) {
  const o = {};
  for (const k of new Set([...Object.keys(t), ...Object.keys(m)])) {
    if (skip(k)) continue;
    let v;
    if (k === 'opened') v = Math.max(m[k] || 0, t[k] || 0);
    else if (eqv(m[k], t[k])) v = t[k];
    else if (b && eqv(m[k], b[k])) v = t[k];
    else if (b && eqv(t[k], b[k])) v = m[k];
    else v = pref === 'm' ? m[k] : t[k];
    if (v !== undefined) o[k] = v;
  }
  return o;
}
const isAvKey = k => k === 'av' || k === 'avMiss' || k === 'avFails';
function mergeItem(b, m, t, pref) {
  const o = mergeFields(b, m, t, pref, isAvKey);
  // アイコンは、IDが合っている側から（両方にあればファイル側にそろえる）
  const src = [t, m].filter(x => x.pid === o.pid), withAv = src.find(x => x.av);
  if (o.noAv) return o;
  if (withAv) o.av = withAv.av;
  else if (src[0]) { if (src[0].avMiss) o.avMiss = src[0].avMiss; if (src[0].avFails) o.avFails = src[0].avFails; }
  return o;
}
function indexOf3(d) {
  const S = new Map(), C = new Map(), I = new Map();
  if (d) for (const s of d.sites) { S.set(s.id, { o: s, p: '' }); for (const c of s.cats) { C.set(c.id, { o: c, p: s.id }); for (const it of c.items) I.set(it.id, { o: it, p: c.id }); } }
  return { S, C, I };
}
/* B：基準（なければ null）、M：この端末、T：ほかの端末（ファイル）。pref：両方で同じ所を変えたときに優先する側 */
function merge3(B, M, T, pref = 'm') {
  const ib = indexOf3(B), im = indexOf3(M), it3 = indexOf3(T);
  const trivial = k => k === 'opened' || isAvKey(k);
  const kids = k => k === 'cats' || k === 'items';
  const pickParent = (b, m, t) => m.p === t.p ? t.p : b && b.p === m.p ? t.p : b && b.p === t.p ? m.p : (pref === 'm' ? m.p : t.p);
  function mergeKind(K) {
    const out = new Map();
    for (const id of new Set([...it3[K].keys(), ...im[K].keys()])) {
      const b = ib[K].get(id), m = im[K].get(id), t = it3[K].get(id);
      if (m && t) out.set(id, { o: K === 'I' ? mergeItem(b?.o, m.o, t.o, pref) : mergeFields(b?.o, m.o, t.o, pref, kids), p: pickParent(b, m, t) });
      else {
        const x = m || t;
        // 片方で消されたもの：残っている側で中身を変えていなければ消す
        if (b && b.p === x.p) {
          const keys = new Set([...Object.keys(b.o), ...Object.keys(x.o)]);
          if (![...keys].some(k => !kids(k) && !trivial(k) && !eqv(b.o[k], x.o[k]))) continue;
        }
        const o = {}; for (const k of Object.keys(x.o)) if (!kids(k)) o[k] = x.o[k];
        out.set(id, { o, p: x.p, only: b ? '' : m ? 'm' : 't' });
      }
    }
    return out;
  }
  const S = mergeKind('S'), C = mergeKind('C'), I = mergeKind('I');
  const siteOfCat = cid => (C.get(cid) || im.C.get(cid) || it3.C.get(cid))?.p;
  // 両方の端末で別々に登録した同じアカウントは1つにまとめる
  const newT = new Map();
  for (const x of I.values()) if (x.only === 't') newT.set(siteOfCat(x.p) + '\n' + x.o.pid.toLowerCase(), x);
  for (const [id, x] of [...I]) {
    if (x.only !== 'm') continue;
    const y = newT.get(siteOfCat(x.p) + '\n' + x.o.pid.toLowerCase()); if (!y) continue;
    y.o.name ||= x.o.name; y.o.opened = Math.max(y.o.opened || 0, x.o.opened || 0); y.o.av ||= x.o.av; if (!y.o.av) delete y.o.av;
    if (x.o.memo && x.o.memo !== y.o.memo) y.o.memo = y.o.memo ? y.o.memo + ' ／ ' + x.o.memo : x.o.memo;
    I.delete(id);
  }
  // 中身が残っているカテゴリ・サイトは消さない
  for (const x of I.values()) if (!C.has(x.p)) { const c = im.C.get(x.p) || it3.C.get(x.p); const { items, ...o } = c.o; C.set(x.p, { o, p: c.p }); }
  for (const x of C.values()) if (!S.has(x.p)) { const q = im.S.get(x.p) || it3.S.get(x.p); const { cats, ...o } = q.o; S.set(x.p, { o, p: '' }); }
  // 並び順：この端末で並べ替えていればこの端末の順、そうでなければファイルの順
  function order(members, bl, ml, tl) {
    const both = new Set(bl.filter(id => ml.includes(id)));
    const moved = bl.filter(id => both.has(id)).join() !== ml.filter(id => both.has(id)).join();
    const [p, q] = moved ? [ml, tl] : [tl, ml];
    const out = p.filter(id => members.has(id));
    q.forEach((id, i) => {
      if (!members.has(id) || out.includes(id)) return;
      let at = -1; for (let k = i - 1; k >= 0 && at < 0; k--) at = out.indexOf(q[k]);
      out.splice(at < 0 && i > 0 ? out.length : at + 1, 0, id);
    });
    for (const id of members) if (!out.includes(id)) out.push(id);
    return out;
  }
  const ids = l => (l || []).map(x => x.id);
  const group = K => { const g = new Map(); for (const [id, x] of K) { if (!g.has(x.p)) g.set(x.p, new Set()); g.get(x.p).add(id); } return g; };
  const gc = group(C), gi = group(I), none = new Set();
  const sites = order(new Set(S.keys()), ids(B?.sites), ids(M.sites), ids(T.sites)).map(sid => ({
    ...S.get(sid).o,
    cats: order(gc.get(sid) || none, ids(ib.S.get(sid)?.o.cats), ids(im.S.get(sid)?.o.cats), ids(it3.S.get(sid)?.o.cats)).map(cid => ({
      ...C.get(cid).o,
      items: order(gi.get(cid) || none, ids(ib.C.get(cid)?.o.items), ids(im.C.get(cid)?.o.items), ids(it3.C.get(cid)?.o.items)).map(id => I.get(id).o),
    })),
  }));
  return normalize({ updatedAt: Math.max(M.updatedAt || 0, T.updatedAt || 0), avFix1: 1, settings: mergeFields(B?.settings, M.settings, T.settings, pref, () => false), sites });
}
/* 基準がないとき：同じサイト・カテゴリ・アカウントとみなせるものは、id をファイル側にそろえる */
function alignIds(M, T) {
  const d = JSON.parse(JSON.stringify(M));
  const match = (ml, tl, same) => {
    const used = new Set(ml.map(x => x.id)), taken = new Set();
    for (const m of ml) if (tl.some(t => t.id === m.id)) taken.add(m.id);
    for (const m of ml) {
      if (taken.has(m.id)) continue;
      const t = tl.find(x => !used.has(x.id) && !taken.has(x.id) && same(x, m));
      if (t) { m.id = t.id; taken.add(t.id); }
    }
  };
  match(d.sites, T.sites, (x, y) => x.template === y.template);
  for (const s of d.sites) {
    const ts = T.sites.find(x => x.id === s.id); if (!ts) continue;
    match(s.cats, ts.cats, (x, y) => x.name === y.name);
    match(s.cats.flatMap(c => c.items), ts.cats.flatMap(c => c.items), (x, y) => x.pid.toLowerCase() === y.pid.toLowerCase());
  }
  return d;
}

/* ============ 保存 ============ */
const hasFS = 'showSaveFilePicker' in window;
let fh = null, fState = hasFS ? 'none' : 'unsupported'; // none|need|ok|err|hold|unsupported
let saving = false, saveTimer = 0, wq = Promise.resolve();
let lastText = null, editN = 0, holdMsg = '';
const FTYPES = [{ description: 'JSON', accept: { 'application/json': ['.json'] } }];
if (!data.rev) data.rev = 'x-' + bodyHash(data); // 版の名前がない以前のデータ

function persistLocal() { try { localStorage.setItem(LS_DATA, JSON.stringify(data)); } catch (e) { console.warn(e); } }
function save(rerender = true) {
  data.updatedAt = Date.now(); editN++;
  persistLocal();
  if (fState === 'ok') { saving = true; clearTimeout(saveTimer); saveTimer = setTimeout(writeFile, 400); }
  if (rerender) render(); else renderState();
}
// 入力・ドラッグの途中でデータを差し替えると操作が壊れるので、その間は待つ
const busy = () => !!(document.querySelector('dialog[open]') || document.querySelector('#main input') || menuEl || drag);

async function readShelf() {
  const text = await (await fh.getFile()).text();
  if (!text.trim()) return { kind: 'empty' };
  try {
    const raw = JSON.parse(text), h = Array.isArray(raw?.sites) ? bodyHash(raw) : '';
    // rev と中身が合わないとき（以前の版のアプリや手作業で書き換えたとき）は、新しい版として扱う
    const ok = typeof raw?.rev === 'string' && raw.rev.endsWith('-' + h);
    const rev = ok ? raw.rev : 'x-' + h, d = normalize(raw);
    const hist = uniq([...(ok ? [] : [d.rev]), ...d.hist]).filter(x => x !== rev);
    return { kind: 'ok', text, d, rev, hist };
  } catch (e) { return { kind: 'bad', msg: e.message }; }
}
/* この端末のデータから見た、ファイルの位置づけ */
function relation(f) {
  if (f.rev === data.rev) return { type: 'same' };
  if (data.hist.includes(f.rev)) return { type: 'old' };
  const theirs = new Set(f.hist);
  const base = [data.rev, ...data.hist].find(r => theirs.has(r) && bases.some(x => x.rev === r));
  if (base) return { type: 'merge', base: baseOf(base) };
  if (theirs.has(data.rev) && data.rev === 'x-' + bodyHash(data)) return { type: 'merge', base: data };
  return { type: 'unknown' };
}
function setBase(f, oldRev, oldHist) {
  data.rev = f.rev;
  data.hist = uniq([oldRev, ...f.hist.slice(0, 80), ...oldHist.slice(0, 80)]).filter(x => x !== f.rev);
  rememberBase(f.rev, f.d, false);
}
function takeMerged(f, base) {
  const old = data, mine = base ? old : alignIds(old, f.d);
  const next = merge3(base, mine, f.d, old.updatedAt >= f.d.updatedAt ? 'm' : 't');
  rebaseUndo(old, next);
  data = next; setBase(f, old.rev, old.hist); persistLocal();
  return !sameBody(old, next);
}
function takeFile(f) { // ファイルの内容に切り替える
  const old = data;
  if (countItems(old) && !sameBody(old, f.d)) pushUndo('ファイルの内容への切り替え');
  data = f.d; setBase(f, old.rev, old.hist); persistLocal();
}
/* ファイルの変更を取り込む。戻り値：busy（あとで）／old（ファイルの方が古い）／ok */
function absorb(f) {
  const r = relation(f);
  if (r.type === 'same' || r.type === 'old') return r.type === 'old' ? 'old' : 'ok';
  if (busy()) return 'busy';
  if (takeMerged(f, r.base || null)) { render(); toast('ほかの端末での変更を取り込みました'); }
  return 'ok';
}
function hold(f) {
  fState = 'hold'; saving = false;
  holdMsg = f.kind === 'empty' ? '保存ファイルが空になっています。' : '保存ファイルの中身を読めません（' + f.msg + '）。';
  renderState(); renderBanner();
}
async function putFile() {
  const n = editN, oldRev = data.rev, oldHist = data.hist;
  const rev = Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + '-' + bodyHash(data);
  data.rev = rev; data.hist = uniq([oldRev, ...oldHist]).slice(0, 160);
  const text = JSON.stringify(data, null, 1);
  rememberBase(rev, data, true);
  try {
    const w = await fh.createWritable();
    await w.write(text); await w.close();
  } catch (e) {
    if (data.rev === rev) { data.rev = oldRev; data.hist = uniq([...oldHist, rev]); }
    throw e;
  }
  lastText = text; persistLocal();
  saving = editN !== n; renderState();
}
function failed(e) { console.error(e); saving = false; fState = 'err'; renderState(); renderBanner(); }
function writeFile() {
  clearTimeout(saveTimer);
  if (!fh || fState !== 'ok') return wq;
  saving = true; renderState();
  wq = wq.then(async () => {
    if (!fh || fState !== 'ok') { saving = false; return; }
    const f = await readShelf(); // 書く前に必ず今のファイルを確かめる
    if (f.kind !== 'ok') { hold(f); return; }
    if (f.text !== lastText) {
      if (absorb(f) === 'busy') { saveTimer = setTimeout(writeFile, 1000); return; }
      lastText = f.text;
      if (data.rev === f.rev && sameBody(data, f.d)) { saving = false; renderState(); return; }
    }
    await putFile();
  }).catch(failed);
  return wq;
}
/* アプリに戻ってきたときに、ほかの端末の変更がないか見る */
let lastCheck = 0;
function checkFile() {
  if (!fh || fState !== 'ok' || Date.now() - lastCheck < 1500) return;
  lastCheck = Date.now();

/* 取り消し履歴：変更の直前の状態を最大 UNDO_MAX 件まで覚える。
   localStorage に残すので開き直しても使える。容量を抑えるためアイコン画像（av）は含めない */
const UNDO_MAX = 30, LS_UNDO = 'snsShelf.undo';
let undoStack = [];
try { undoStack = JSON.parse(localStorage.getItem(LS_UNDO)) || []; } catch {}
function persistUndo() {
  for (let k = 0; k < undoStack.length || k === 0; k++) {
    try { localStorage.setItem(LS_UNDO, JSON.stringify(undoStack.slice(k))); return; }
    catch (e) { if (e.name !== 'QuotaExceededError') return; } // 入りきらなければ古い分を除いて保存（画面上の履歴はそのまま）
  }
}
const avMemo = new Map(); // 履歴に入れないアイコン画像の控え（id → {pid, av}）
function pushUndo(label) {
  for (const s of data.sites) for (const c of s.cats) for (const it of c.items) if (it.av) avMemo.set(it.id, { pid: it.pid, av: it.av });
  undoStack.push({ label, snap: JSON.stringify(data, (k, v) => k === 'av' ? undefined : v), at: Date.now() });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  persistUndo(); renderUndo();
}
/* ほかの端末の変更（from → to）を、取り消し用の控えにも入れておく。取り消してもその変更は残る */
function rebaseUndo(from, to) {
  if (!undoStack.length || sameBody(from, to)) return;
  for (const u of undoStack) {
    try { u.snap = JSON.stringify(merge3(from, normalize(JSON.parse(u.snap)), to, 'm'), (k, v) => k === 'av' ? undefined : v); }
    catch (e) { console.warn(e); }
  }
  persistUndo();
}
function undo() {
  const u = undoStack.pop(); if (!u) return;
  // 開いた日時・取得したアイコンは、戻したあとも新しい方を残す
  const keep = new Map();
  for (const s of data.sites) for (const c of s.cats) for (const it of c.items) keep.set(it.id, it);
  const { rev, hist } = data;
  data = Object.assign(normalize(JSON.parse(u.snap)), { rev, hist });
  for (const s of data.sites) for (const c of s.cats) for (const it of c.items) {
    const n = keep.get(it.id), m = avMemo.get(it.id);
    if (n && (n.opened || 0) > (it.opened || 0)) it.opened = n.opened;
    if (n?.av && n.pid === it.pid) it.av = n.av;
    else if (m && m.pid === it.pid) it.av = m.av;
  }
  save(); persistUndo(); renderUndo();
  toast('元に戻しました：' + u.label);
}
function renderUndo() {
  const b = $('#undoBtn'), u = undoStack[undoStack.length - 1];
  b.disabled = !u;
  b.title = u ? `元に戻す（Ctrl+Z）\n${u.label}（${ago(u.at)}）${undoStack.length > 1 ? `\nほか ${undoStack.length - 1} 件の履歴` : ''}` : '元に戻せる操作はありません';
  $('#undoN').textContent = undoStack.length || '';
}
function withUndo(msg, fn) {
  pushUndo(msg); fn(); save();
  toast(msg, '元に戻す', undo);
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { e.target.closest('dialog').close(); return; }
  const nav = e.target.closest('.side [data-view]');
  if (nav) { ui.view = nav.dataset.view; saveUi(); render(); scrollTo({ top: 0 }); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const catEl = a.closest('.cat'), siteEl = a.closest('.site');
  switch (a.dataset.act) {
    case 'edit': openEdit(a.closest('.chip').dataset.iid); break;
    case 'add': openAdd({ sid: catEl.dataset.sid, cid: catEl.dataset.cid }); break;
    case 'addcat': addCat(siteEl.dataset.sid); break;
    case 'editsite': openSite(siteEl.dataset.sid); break;
    case 'addsite': openSite(); break;
    case 'openall': openAll(catEl); break;
    case 'fnew': connectNew(); break;
    case 'fopen': connectOpen(); break;
    case 'frecon': reconnect(); break;
    case 'fforce': forceWrite(); break;
    case 'catmenu': {
      const s = findSite(catEl.dataset.sid), c = s.cats.find(x => x.id === catEl.dataset.cid);
      showMenu(a, [['名前を変更', () => renameCat(catEl)], ['このカテゴリに登録', () => openAdd({ sid: s.id, cid: c.id })],
        ['カテゴリを削除', () => {
          if (c.items.length && !confirm(`「${c.name}」と中の ${c.items.length} 件を削除しますか？`)) return;
          withUndo(`カテゴリ「${c.name}」を削除しました`, () => s.cats.splice(s.cats.indexOf(c), 1));
        }, 'danger']]);
      break;
    }
  }
});
$('#main').addEventListener('click', e => { const n = e.target.closest('.cname'); if (n) renameCat(n.closest('.cat')); });
function markOpened(e) {
  const a = e.target.closest('.chip a'); if (!a) return;
  if (e.type === 'auxclick' && e.button !== 1) return;
  const f = findItem(a.parentElement.dataset.iid); if (!f) return;
  f.it.opened = Date.now(); a.parentElement.classList.remove('stale'); save(false);
  setTimeout(renderSide, 0);
}
$('#main').addEventListener('click', markOpened);
$('#main').addEventListener('auxclick', markOpened);
$('#state').onclick = () => fState === 'need' ? reconnect() : openSettings();
$('#setBtn').onclick = openSettings;
$('#undoBtn').onclick = undo;
renderUndo();
$('#sort').value = ui.sort;
$('#showClosed').checked = ui.showClosed;
$('#showClosed').onchange = e => { ui.showClosed = e.target.checked; saveUi(); renderMain(); };
$('#sort').onchange = e => { ui.sort = e.target.value; saveUi(); render(); };
$('#q').addEventListener('input', renderMain);
$('#addForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#addInput').value.trim(); $('#addInput').value = ''; openAdd(splitPaste(v)); });

/* 貼り付け・ドロップ：1行目 URL、2行目 表示名（任意） */
function splitPaste(t) {
  const lines = String(t).split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  return { text: lines[0] || '', name: lines[1] || '', icon: lines[2] || '' }; // 3行目＝アイコン画像のURL（ブックマークレット）
}
const typing = el => !!el?.closest?.('input,textarea,select,[contenteditable]');
document.addEventListener('paste', e => {
  if (typing(e.target) || document.querySelector('dialog[open]')) return;
  const t = e.clipboardData.getData('text'); if (!t.trim()) return;
  e.preventDefault(); openAdd(splitPaste(t));
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing(e.target) && !document.querySelector('dialog[open]')) { e.preventDefault(); undo(); return; }
  if (e.key === '/' && !typing(e.target) && !document.querySelector('dialog[open]')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && e.target === $('#q') && $('#q').value) { $('#q').value = ''; renderMain(); }
});

/* ============ ドラッグ＆ドロップ ============ */
let drag = null;
const clearMarks = () => document.querySelectorAll('.mark-l,.mark-r,.mark-t,.mark-b,.mark-end').forEach(x => x.classList.remove('mark-l', 'mark-r', 'mark-t', 'mark-b', 'mark-end'));
$('#main').addEventListener('dragstart', e => {
  const chip = e.target.closest?.('.chip[draggable]');
  if (chip) { const cat = chip.closest('.cat'); drag = { type: 'item', sid: cat.dataset.sid, iid: chip.dataset.iid }; chip.classList.add('dragging'); }
  else { const h = e.target.closest?.('.cathead[draggable]'); if (!h) return; const cat = h.closest('.cat'); drag = { type: 'cat', sid: cat.dataset.sid, cid: cat.dataset.cid }; }
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('application/x-shelf', '1');
});
$('#main').addEventListener('dragend', () => { drag = null; clearMarks(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });
function dropTarget(e) {
  const cat = e.target.closest?.('.cat'); if (!cat || cat.dataset.sid !== drag.sid) return null;
  if (drag.type === 'cat') { const r = cat.getBoundingClientRect(); return { cat, before: e.clientY < r.top + r.height / 2 }; }
  const chip = e.target.closest('.chip');
  if (chip && chip.dataset.iid !== drag.iid) { const r = chip.getBoundingClientRect(); return { cat, chip, before: e.clientX < r.left + r.width / 2 }; }
  if (chip) return { cat, self: true };
  return { cat };
}
$('#main').addEventListener('dragover', e => {
  if (!drag) return;
  const t = dropTarget(e); clearMarks(); if (!t) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  if (drag.type === 'cat') { if (t.cat.dataset.cid !== drag.cid) t.cat.classList.add(t.before ? 'mark-t' : 'mark-b'); }
  else if (t.chip) t.chip.classList.add(t.before ? 'mark-l' : 'mark-r');
  else if (!t.self) t.cat.querySelector('.chips').classList.add('mark-end');
});
$('#main').addEventListener('drop', e => {
  if (!drag) return; const t = dropTarget(e); clearMarks(); if (!t) return; e.preventDefault(); e.stopPropagation();
  const s = findSite(drag.sid);
  if (t.self || (drag.type === 'cat' && t.cat.dataset.cid === drag.cid)) return;
  pushUndo(drag.type === 'cat' ? 'カテゴリの並べ替え' : `「${dispName(findItem(drag.iid).it)}」の移動`);
  if (drag.type === 'cat') {
    const from = s.cats.findIndex(c => c.id === drag.cid); const [c] = s.cats.splice(from, 1);
    let to = s.cats.findIndex(x => x.id === t.cat.dataset.cid); if (!t.before) to++;
    s.cats.splice(to, 0, c);
  } else {
    if (t.self) return;
    const f = findItem(drag.iid); f.c.items.splice(f.i, 1);
    const dest = s.cats.find(c => c.id === t.cat.dataset.cid);
    if (t.chip) { let to = dest.items.findIndex(x => x.id === t.chip.dataset.iid); if (!t.before) to++; dest.items.splice(to, 0, f.it); }
    else dest.items.push(f.it);
  }
  drag = null; save();
});
/* 外部からのリンクのドロップ */
let dragDepth = 0;
const extDrag = e => !drag && [...e.dataTransfer.types].some(t => t === 'text/uri-list' || t === 'text/plain');
document.addEventListener('dragenter', e => { if (extDrag(e)) { dragDepth++; $('#dropover').classList.add('show'); } });
document.addEventListener('dragleave', e => { if (extDrag(e) && --dragDepth <= 0) { dragDepth = 0; $('#dropover').classList.remove('show'); } });
document.addEventListener('dragover', e => { if (extDrag(e)) e.preventDefault(); });
document.addEventListener('drop', e => {
  dragDepth = 0; $('#dropover').classList.remove('show');
  if (drag || !e.dataTransfer) return;
  const u = (e.dataTransfer.getData('text/uri-list') || '').split(/\r?\n/).find(x => x && !x.startsWith('#')) || e.dataTransfer.getData('text/plain');
  if (!u) return; e.preventDefault(); openAdd(splitPaste(u));
});

/* ============ 起動 ============ */
render();
initFile().then(() => {
  const p = new URLSearchParams(location.search);
  if (p.get('add')) openAdd({ text: p.get('add'), name: p.get('name') || '' });
});
</script>
</body>
</html>
